<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PixelPlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🎮 PixelPlay</h1>
  <nav>
    <button onclick="filter('all')">Tous</button>
    <button onclick="filter('arcade')">Arcade</button>
    <button onclick="filter('action')">Action</button>
  </nav>
</header>

<section class="hero">
  <h2>Joue gratuitement 🎮</h2>
  <p>Une petite plateforme de jeux créée par toi.</p>
</section>

<div class="searchbox">
  <input class="search" id="search" placeholder="🔎 Rechercher un jeu..." oninput="render()">
</div>

<main class="grid" id="games"></main>

<footer>PixelPlay • Tes jeux, ton site 🚀</footer>

<script>
const games = [
  {
    name: 'Super Pixel Quest',
    cat: 'arcade',
    emoji: '⭐',
    url: 'jeux/super-pixel-quest/',
    desc: 'Plateforme rétro'
  },
  {
    name: 'Car Dodge',
    cat: 'action',
    emoji: '🚗',
    url: 'jeux/car-dodge/',
    desc: 'Évite les voitures'
  },
  {
    name: 'Space Defender',
    cat: 'action',
    emoji: '🚀',
    url: 'jeux/space-defender/',
    desc: 'Protège ta base'
  }
];

let current = 'all';

function filter(category) {
  current = category;
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();

  const list = games.filter(game =>
    (current === 'all' || game.cat === current) &&
    game.name.toLowerCase().includes(q)
  );

  document.getElementById('games').innerHTML =
    list.map(game => `
      <article class="card">
        <div class="thumb">${game.emoji}</div>
        <div>
          <h3>${game.name}</h3>
          <span class="tag">${game.cat} • ${game.desc}</span>
          <br>
          <a class="play" href="${game.url}">JOUER ▶</a>
        </div>
      </article>
    `).join('') || '<p>Aucun jeu trouvé.</p>';
}

render();
</script>

</body>
</html>
