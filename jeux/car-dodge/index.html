<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Car Dodge 🚗</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,sans-serif;color:white}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100vw;height:100vh;overflow:hidden;background:#111827;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:min(92vw,900px);height:min(90vh,650px);background:#222;border:4px solid #374151;border-radius:18px;box-shadow:0 0 35px #0009}
#hud{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;text-shadow:2px 2px #000;z-index:2;white-space:nowrap}
#help{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#000a;padding:8px 14px;border-radius:12px;font-size:14px;text-align:center;z-index:2}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000b;z-index:5}
.panel{background:#fff;color:#111827;border:5px solid #1f2937;border-radius:22px;padding:28px;max-width:520px;text-align:center;box-shadow:0 12px 0 #000}
h1{margin:0 0 12px;font-size:42px}
p{font-size:18px;line-height:1.45}
button{border:0;border-radius:14px;background:#22c55e;color:white;font-size:22px;font-weight:900;padding:14px 28px;cursor:pointer;box-shadow:0 6px 0 #15803d}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #15803d}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="900" height="650"></canvas>
<div id="hud">🏁 Distance : 0 m &nbsp; ❤️ 3 &nbsp; ⚡ 0</div>
<div id="help">← → / A D : changer de voie &nbsp; • &nbsp; ESPACE : accélérer &nbsp; • &nbsp; R : recommencer</div>

<div id="start" class="overlay">
  <div class="panel">
    <h1>🚗 CAR DODGE</h1>
    <p>Conduis le plus loin possible et évite les voitures !</p>
    <p><b>Contrôles :</b> ← → ou A D pour changer de voie. ESPACE donne un petit boost.</p>
    <button id="play">JOUER 🎮</button>
  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <h1>💥 ACCIDENT !</h1>
    <p id="finalText"></p>
    <button id="again">REJOUER 🔄</button>
  </div>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=900,H=650;

let keys={},playing=false,score=0,lives=3,speed=5,roadOffset=0,lastTime=0;
let spawnTimer=0,boost=0;
const road={x:210,w:480};
const lanes=[270,390,510,630];
const player={lane:1,x:lanes[1],y:535,w:54,h:92,targetX:lanes[1]};
let cars=[];

document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(["arrowleft","arrowright"," "].includes(k)) e.preventDefault();

  if(!playing)return;

  if((k==="arrowleft"||k==="a") && player.targetX===player.x){
    const i=lanes.indexOf(player.x);
    if(i>0) player.targetX=lanes[i-1];
  }
  if((k==="arrowright"||k==="d") && player.targetX===player.x){
    const i=lanes.indexOf(player.x);
    if(i<lanes.length-1) player.targetX=lanes[i+1];
  }
  if(k==="r") resetGame();
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function resetGame(){
  score=0;lives=3;speed=5;roadOffset=0;spawnTimer=0;boost=0;cars=[];
  player.lane=1;player.x=lanes[1];player.targetX=lanes[1];
  playing=true;
  document.getElementById("gameOver").classList.add("hidden");
  updateHud();
}

function updateHud(){
  document.getElementById("hud").innerHTML=
    `🏁 Distance : ${Math.floor(score)} m &nbsp; ❤️ ${lives} &nbsp; ⚡ ${Math.floor(boost)}`;
}

function spawnCar(){
  const lane=Math.floor(Math.random()*lanes.length);
  const colors=["#ef4444","#3b82f6","#f59e0b","#a855f7","#14b8a6"];
  cars.push({
    x:lanes[lane],y:-120,w:54,h:92,
    speed:speed*(0.75+Math.random()*0.35),
    color:colors[Math.floor(Math.random()*colors.length)]
  });
}

function hit(a,b){
  return a.x-a.w/2 < b.x+b.w/2 &&
         a.x+a.w/2 > b.x-b.w/2 &&
         a.y < b.y+b.h/2 &&
         a.y+a.h/2 > b.y-b.h/2;
}

function update(dt){
  if(!playing)return;

  const boosting=keys[" "]&&boost>0;
  if(boosting)boost=Math.max(0,boost-dt*18);

  const moveSpeed=0.22*dt;
  player.x+=(player.targetX-player.x)*moveSpeed;

  const roadSpeed=(speed+(boosting?4:0))*dt;
  roadOffset=(roadOffset+roadSpeed)%80;

  score+=dt*0.045*(speed+(boosting?4:0));
  speed=Math.min(13,5+score/250);

  spawnTimer+=dt;
  const interval=Math.max(430,1050-score*1.2);
  if(spawnTimer>interval){
    spawnTimer=0;
    spawnCar();
  }

  for(let i=cars.length-1;i>=0;i--){
    const car=cars[i];
    car.y+=car.speed*dt*0.06+roadSpeed*0.055;

    if(hit(
      {x:player.x,y:player.y,w:player.w-10,h:player.h-10},
      car
    )){
      cars.splice(i,1);
      lives--;
      player.targetX=lanes[Math.max(0,Math.min(3,lanes.indexOf(player.targetX)+
        (Math.random()<0.5?-1:1)))];
      boost=0;
      if(lives<=0){endGame();return;}
    }else if(car.y>H+150){
      cars.splice(i,1);
      boost=Math.min(100,boost+12);
    }
  }

  updateHud();
}

function drawCar(x,y,w,h,color,playerCar=false){
  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="#111";
  ctx.fillRect(-w/2-7,-h/2+14,8,22);
  ctx.fillRect(w/2-1,-h/2+14,8,22);
  ctx.fillRect(-w/2-7,h/2-36,8,22);
  ctx.fillRect(w/2-1,h/2-36,8,22);

  ctx.fillStyle=color;
  ctx.roundRect(-w/2,-h/2,w,h,10);
  ctx.fill();

  ctx.fillStyle=playerCar?"#93c5fd":"#cbd5e1";
  ctx.roundRect(-w/2+9,-h/2+17,w-18,31,7);
  ctx.fill();

  ctx.fillStyle="#111827";
  ctx.roundRect(-w/2+12,-h/2+21,w-24,22,5);
  ctx.fill();

  ctx.fillStyle="#f8fafc";
  ctx.fillRect(-w/2+7,-h/2+6,12,6);
  ctx.fillRect(w/2-19,-h/2+6,12,6);

  ctx.fillStyle="#ef4444";
  ctx.fillRect(-w/2+7,h/2-12,12,6);
  ctx.fillRect(w/2-19,h/2-12,12,6);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // herbe
  ctx.fillStyle="#166534";
  ctx.fillRect(0,0,W,H);

  // décor latéral
  for(let y=-80+(roadOffset%80);y<H;y+=80){
    ctx.fillStyle="#22c55e";
    ctx.fillRect(65,y,18,38);
    ctx.fillRect(817,y+25,18,38);
  }

  // route
  ctx.fillStyle="#374151";
  ctx.fillRect(road.x,0,road.w,H);

  // bandes extérieures
  ctx.fillStyle="#f8fafc";
  ctx.fillRect(road.x,0,7,H);
  ctx.fillRect(road.x+road.w-7,0,7,H);

  // lignes centrales
  ctx.fillStyle="#f8fafc";
  for(let x=road.x+120;x<road.x+road.w;x+=120){
    for(let y=-80+roadOffset;y<H;y+=80){
      ctx.fillRect(x,y,7,42);
    }
  }

  // voitures ennemies
  cars.forEach(c=>drawCar(c.x,c.y,c.w,c.h,c.color));

  // joueur
  drawCar(player.x,player.y,player.w,player.h,"#2563eb",true);

  // boost
  if(keys[" "]&&boost>0){
    ctx.fillStyle="#fbbf24";
    ctx.beginPath();
    ctx.moveTo(player.x-12,player.y+player.h/2);
    ctx.lineTo(player.x,player.y+player.h/2+38);
    ctx.lineTo(player.x+12,player.y+player.h/2);
    ctx.fill();
  }
}

function endGame(){
  playing=false;
  document.getElementById("finalText").textContent=
    `Distance parcourue : ${Math.floor(score)} m`;
  document.getElementById("gameOver").classList.remove("hidden");
}

document.getElementById("play").onclick=()=>{
  document.getElementById("start").classList.add("hidden");
  resetGame();
};
document.getElementById("again").onclick=resetGame;

function loop(t){
  const dt=Math.min(32,t-lastTime||16);
  lastTime=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
