<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Defender</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#fff;font-family:Arial;display:grid;place-items:center;height:100vh}#w{position:relative}canvas{width:min(94vw,900px);height:min(90vh,650px);background:#020617;border:4px solid #1e293b;border-radius:20px;box-shadow:0 0 45px #0ea5e955}.hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#0f172dcc;padding:9px 16px;border-radius:12px;font-weight:bold;z-index:2}.screen{position:absolute;inset:0;background:#000b;display:grid;place-items:center}.panel{background:#f8fafc;color:#0f172a;padding:30px;border-radius:22px;text-align:center;max-width:520px}.hide{display:none!important}button{background:#2563eb;color:#fff;border:0;padding:14px 28px;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer}</style></head><body><div id="w"><canvas id="c" width="900" height="650"></canvas><div class="hud" id="hud">⭐ 0　❤️ 3</div><div class="screen" id="screen"><div class="panel"><h1>🚀 SPACE DEFENDER</h1><p>Protège ta base et détruis les météorites.</p><p>← → déplacer • ESPACE tirer</p><button onclick="start()">JOUER</button></div></div></div><script>
const c=document.getElementById("c"),x=c.getContext("2d"),W=900,H=650;let k={},ship,shots,enemies,score,lives,spawn,last,run=false,stars=[];for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2});
onkeydown=e=>{k[e.key.toLowerCase()]=1;if([" ","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault()};onkeyup=e=>k[e.key.toLowerCase()]=0;
function start(){ship={x:450,y:575,cool:0};shots=[];enemies=[];score=0;lives=3;spawn=0;last=performance.now();run=true;screen.classList.add("hide");hud();requestAnimationFrame(loop)}
function hud(){document.getElementById("hud").textContent=`⭐ ${score}　❤️ ${lives}`}
function end(){run=false;document.querySelector(".panel").innerHTML=`<h1>💥 DÉFAITE</h1><p>Score : ${score}</p><button onclick="start()">REJOUER</button>`;screen.classList.remove("hide")}
function loop(t){if(!run)return;let dt=Math.min(32,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){let s=7*dt/16;if(k.arrowleft)ship.x-=s;if(k.arrowright)ship.x+=s;ship.x=Math.max(30,Math.min(870,ship.x));spawn+=dt;if(spawn>Math.max(280,720-score*2)){spawn=0;enemies.push({x:25+Math.random()*850,y:-40,r:16+Math.random()*18,v:2+Math.random()*2})}ship.cool-=dt;if(k[" "]&&ship.cool<=0){shots.push({x:ship.x,y:ship.y-25});ship.cool=150}shots.forEach(b=>b.y-=10*dt/16);enemies.forEach(e=>e.y+=e.v*dt/16);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.y>690){enemies.splice(i,1);lives--;hud();if(lives<=0)return end();continue}for(let j=shots.length-1;j>=0;j--){let b=shots[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+6){enemies.splice(i,1);shots.splice(j,1);score+=10;hud();break}}}shots=shots.filter(b=>b.y>-20)}
function draw(){x.fillStyle="#020617";x.fillRect(0,0,W,H);stars.forEach(s=>{s.y+=.25;if(s.y>H)s.y=0;x.globalAlpha=.3+s.s*.2;x.fillRect(s.x,s.y,s.s,s.s)});x.globalAlpha=1;shots.forEach(b=>{x.fillStyle="#67e8f9";x.fillRect(b.x-3,b.y-12,6,18)});enemies.forEach(e=>{x.fillStyle="#ef4444";x.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,r=i%2?e.r*.55:e.r;x.lineTo(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r)}x.fill()});x.fillStyle="#38bdf8";x.beginPath();x.moveTo(ship.x,ship.y-28);x.lineTo(ship.x+25,ship.y+22);x.lineTo(ship.x,ship.y+10);x.lineTo(ship.x-25,ship.y+22);x.closePath();x.fill()}draw()
</script></body></html>
